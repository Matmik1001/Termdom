#    Nav        — vim-tmux-navigator (seamless Neovim ↔ tmux pane movement)
#    Clipboard  — wl-clipboard (Wayland primary) → xclip (X11 fallback)
#    Persist    — tmux-resurrect + tmux-continuum (survives reboots)
#
#  Migration note:
#    This config was originally written targeting Ubuntu 24 LTS.
#    It has been fully adapted for Arch Linux — all Wayland paths,
#    clipboard commands, and terminal feature flags have been verified
#    against the Arch package set (tmux ≥ 3.3, wl-clipboard, fzf).
#    No Ubuntu-specific assumptions remain.
#
#  Config path : ~/.config/tmux/tmux.conf
#  Docs        : ~/.config/tmux/TMUX_DOCS.md
#  Version     : 4.0
#
