###############################################################################
# § 1  PREFIX
###############################################################################
unbind C-b
set -g prefix C-a
bind C-a send-prefix

###############################################################################
# § 2  TERMINAL & COLOR FIDELITY
###############################################################################
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Undercurl — required for Neovim LSP diagnostics, theme underlines (e.g. errors)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# Pass FocusGained / FocusLost events through (Neovim autoread, gitsigns refresh)
set -g focus-events on

###############################################################################
# § 3  CORE SETTINGS
###############################################################################
set -g escape-time     0        # Zero latency — critical for Neovim <Esc>
set -g repeat-time     600      # Generous window for repeatable (-r) binds
set -g history-limit   50000    # Scrollback buffer rows
set -g renumber-windows on      # Compact indices after window close
set -g mouse           on
set -g base-index      1        # Human-indexed windows (1, not 0)
set -g pane-base-index 1        # Human-indexed panes
set -g automatic-rename on
set -g automatic-rename-format '#{b:pane_current_path}'  # dir name, not "bash"

# Use smallest attached-client size for each window independently
setw -g aggressive-resize on

# Activity: highlight tabs with new output; no audio bell
set -g monitor-activity on
set -g visual-activity  off
set -g bell-action      none    # Silence compiler/test runner bells

###############################################################################
# § 4  PANE APPEARANCE
###############################################################################
set -g pane-border-style        "fg=#3b4261"
set -g pane-active-border-style "fg=#7dcfff"
set -g pane-border-lines        single     # tmux ≥ 3.2: clean single-line border
set -g pane-border-indicators   colour     # colour-coded corner markers per pane
set -g display-panes-time       900        # prefix+q pane number visibility (ms)
set -g display-time             1500       # Status message linger time (ms)

###############################################################################
# § 5  STATUS BAR
###############################################################################
set -g status-position bottom
set -g status-interval 5                   # Refresh every 5 s (default = 15)
set -g status-style    "fg=#c0caf5,bg=default"
set -g status-justify  left

# ── Left ──────────────────────────────────────────────────────────────────────
# PREFIX mode indicator → session name → window + pane count
set -g status-left-length 44
set -g status-left \
  "#{?client_prefix,\
#[fg=black bg=#7dcfff bold]  PREFIX ,\
#[fg=#7dcfff bold] 󰣐 #S }\
#[fg=#3b4261]│\
#[fg=#565f89] #{session_windows}w #{window_panes}p \
#[fg=#3b4261]│"

# ── Right ─────────────────────────────────────────────────────────────────────
# git branch → 1-min load avg → RAM used → weekday date → HH:MM
# All shell commands are fast: /proc/loadavg is instant; free(1) < 5 ms
set -g status-right-length 88
set -g status-right \
  "#[fg=#bb9af7]\
#(cd '#{pane_current_path}' \
  && git symbolic-ref --short HEAD 2>/dev/null \
  | sed 's/.*/  󰊤 &  /')\
#[fg=#3b4261]│ \
#[fg=#e0af68] #(cut -d' ' -f1 /proc/loadavg) \
#[fg=#3b4261]│ \
#[fg=#9ece6a] #(free -h | awk '/^Mem/{print \$3}') \
#[fg=#3b4261]│ \
#[fg=#7aa2f7]%a %d %b \
#[fg=#3b4261]│ \
#[fg=#7dcfff bold]%H:%M "

# ── Window Tabs ───────────────────────────────────────────────────────────────
set -g window-status-style          "fg=#565f89"
set -g window-status-current-style  "fg=#7dcfff bold"
set -g window-status-activity-style "fg=#e0af68 bold"
set -g window-status-separator      ""
set -g window-status-format         "  #I #W  "
set -g window-status-current-format " #[fg=#7dcfff]#I #W#{?window_zoomed_flag, 󰊓,} "

###############################################################################
# § 6  SESSION & WINDOW MANAGEMENT
###############################################################################
unbind '"'
unbind %

bind |  split-window -h -c "#{pane_current_path}"   # vertical divider
bind -  split-window -v -c "#{pane_current_path}"   # horizontal divider
bind c  new-window      -c "#{pane_current_path}"   # new window at cwd

# Named session prompt
bind N command-prompt -p " New session name:" "new-session -s '%%'"

# Kill without confirmation prompt
bind x kill-pane
bind X kill-window
# Kill server only with explicit confirmation
bind Q confirm-before -p "Kill ALL sessions? (y/n)" kill-server

###############################################################################
# § 7  WINDOW NAVIGATION
###############################################################################
bind -r C-h previous-window
bind -r C-l next-window
bind    Tab last-window               # Toggle last active window (fastest switch)

# Reorder windows left / right
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

###############################################################################
# § 8  PANE OPERATIONS
###############################################################################
bind f resize-pane -Z                 # Toggle zoom / fullscreen

bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Broadcast input to all panes in this window (multi-host / parallel ops)
bind S setw synchronize-panes \; \
       display-message "Sync: #{?pane_synchronized,ON — all panes receive input,OFF}"

# Toggle mouse (disable when you need clean terminal copy/paste)
bind m set -g mouse \; \
       display-message "Mouse: #{?mouse,ON,OFF}"

###############################################################################
# § 9  POPUP UTILITIES
###############################################################################

# Scratch terminal — persistent floating session (survives popup close)
bind '~' display-popup -E -w 84% -h 80% -x C -y C \
  "tmux new-session -A -s scratch"

# FZF session switcher ── C-a C-s
bind C-s display-popup -E -w 54% -h 50% \
  "tmux list-sessions \
     -F '#{session_name}: #{session_windows} windows  [#{?session_attached,attached,detached}]' \
   | fzf --reverse --border rounded \
         --prompt='  Session › ' \
         --color='border:#3b4261,prompt:#7dcfff,pointer:#bb9af7,hl:#e0af68' \
   | cut -d: -f1 \
   | xargs -r tmux switch-client -t"

# FZF window finder across ALL sessions ── C-a C-w
bind C-w display-popup -E -w 64% -h 54% \
  "tmux list-windows -a \
     -F '#{session_name}:#{window_index}  #{window_name}  [#{window_width}×#{window_height}]#{?window_active,  ← here,}' \
   | fzf --reverse --border rounded \
         --prompt='  Window › ' \
         --color='border:#3b4261,prompt:#7dcfff,pointer:#bb9af7,hl:#e0af68' \
   | grep -oP '^[^:]+:\d+' \
   | xargs -r tmux switch-client -t"

# Dev layout preset ── C-a D
# Creates: editor left (65%) | terminal top-right | build output bottom-right
bind D \
  split-window -h -p 35 -c "#{pane_current_path}" \;\
  split-window -v -p 50 -c "#{pane_current_path}" \;\
  select-pane -t 1 \;\
  display-message "Dev layout: editor(1) | terminal(2) | build(3)"

###############################################################################
# § 10  HOUSEKEEPING
###############################################################################
bind r source-file ~/.config/tmux/tmux.conf \; \
       display-message "  tmux.conf reloaded"

bind e new-window -n "[tmux.conf]" "nvim ~/.config/tmux/tmux.conf"

# Clear visible screen AND full scrollback history (not just C-l)
bind C-l send-keys C-l \; \
         run "sleep 0.1" \; \
         clear-history \; \
         display-message "Screen + scrollback cleared"

###############################################################################
# § 11  COPY MODE  (Vim-style)
###############################################################################
setw -g mode-keys vi
set  -g set-clipboard on

# Word boundaries calibrated for C++ — identifiers, operators, path separators
set -g word-separators " .,;:{}[]()<>\"'/\\|=+-*&^%\$#@!~\`?"

bind -T copy-mode-vi v   send -X begin-selection       # visual character
bind -T copy-mode-vi V   send -X select-line            # visual line
bind -T copy-mode-vi C-v send -X rectangle-toggle       # visual block / column
bind -T copy-mode-vi y   send -X copy-selection-and-cancel
bind -T copy-mode-vi Y   send -X copy-line              # yank whole line
bind -T copy-mode-vi D   send -X copy-end-of-line       # yank to EOL

# Enter copy-mode at top of scrollback history
bind u copy-mode \; send -X history-top

# Drop into copy-mode with backward search already activated (like / in Vim)
bind / copy-mode \; send -X search-backward ""

###############################################################################
# § 12  NESTED TMUX / SSH PASSTHROUGH
###############################################################################
# F12 suspends ALL local tmux bindings — every keystroke reaches the inner
# (remote) tmux unchanged.  Status bar dims to grey to signal inner mode.
# Press F12 again to restore normal operation.

bind -T root F12 \
  set prefix None \;\
  set key-table off \;\
  set status-style "fg=#3b4261,bg=default" \;\
  set window-status-current-style "fg=#3b4261 bold" \;\
  set window-status-style "fg=#3b4261" \;\
  set status-left "#[fg=#3b4261 bold] 󰣐 #S │" \;\
  refresh-client -S \;\
  display-message "  SSH passthrough — F12 to return"

bind -T off F12 \
  set -u prefix \;\
  set -u key-table \;\
  set -u status-style \;\
  set -u window-status-current-style \;\
  set -u window-status-style \;\
  set -u status-left \;\
  refresh-client -S \;\
  display-message "  Local mode restored"

###############################################################################
# § 13  PLUGIN SETTINGS
###############################################################################

# ── tmux-yank ─────────────────────────────────────────────────────────────────
set -g @yank_selection       'clipboard'
set -g @yank_selection_mouse 'clipboard'
set -g @yank_action          'copy-pipe-and-cancel'
# Arch Linux: wl-copy ships in the wl-clipboard package (pacman -S wl-clipboard)
# Falls back to xclip for anyone running an X11 session
set -g @override_copy_command 'wl-copy 2>/dev/null || xclip -selection clipboard'

# ── tmux-resurrect ────────────────────────────────────────────────────────────
set -g @resurrect-capture-pane-contents 'on'
#
# NEOVIM SESSION RESTORE — choose one strategy:
#
#   'session'  RECOMMENDED — full restore: buffers, splits, cursor, folds.
#              Requires tpope/vim-obsession in Neovim (run :Obsession once
#              per project to create Session.vim; tmux-resurrect calls it).
#
#   'file'     FALLBACK — restores open files only, no layout.
#              Use if you have not installed vim-obsession yet.
#
set -g @resurrect-strategy-nvim 'session'

# Extra programs to restore across reboot (Arch packages: btm = bottom)
set -g @resurrect-processes 'ssh btm htop watch make ninja'

# ── tmux-continuum ────────────────────────────────────────────────────────────
set -g @continuum-restore       'on'
set -g @continuum-save-interval '10'      # Auto-save every 10 min

# ── tmux-open ─────────────────────────────────────────────────────────────────
# In copy-mode: o → xdg-open  |  C-o → open in $EDITOR below
set -g @open-editor 'nvim'

###############################################################################
# § 14  PLUGINS
###############################################################################
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'           # Sane baseline defaults
set -g @plugin 'christoomey/vim-tmux-navigator'       # Seamless Neovim ↔ tmux pane nav
set -g @plugin 'tmux-plugins/tmux-resurrect'          # Persist sessions across reboot
set -g @plugin 'tmux-plugins/tmux-continuum'          # Auto-save resurrect snapshots
set -g @plugin 'tmux-plugins/tmux-yank'               # Wayland/X11 clipboard bridge
set -g @plugin 'tmux-plugins/tmux-open'               # Open URLs/files from copy-mode

###############################################################################
# § 15  BOOTSTRAP TPM
###############################################################################
run '~/.tmux/plugins/tpm/tpm'
